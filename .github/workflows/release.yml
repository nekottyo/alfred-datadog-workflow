# Tagging via Songmu/tagpr. This workflow builds and uploads artifacts on tag push.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version

      - name: make action-release
        run: make action-release
        env:
          GOARCH: ${{ matrix.arch }}

      - name: Build Alfred Workflow
        id: alfred_builder
        uses: mperezi/build-alfred-workflow@1d1d79861c83b8a4a53a2119f73364d321034015 # v1
        with:
          workflow_dir: ./release

      - name: Rename workflow per arch
        run: mv "${{ steps.alfred_builder.outputs.workflow_file }}" "alfred-datadog-workflow-darwin-${{ matrix.arch }}.alfredworkflow"

      - name: Upload Alfred Workflow
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: alfred-datadog-workflow-darwin-${{ matrix.arch }}.alfredworkflow
