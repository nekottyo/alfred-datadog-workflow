# ref. https://github.com/Songmu/tagpr
name: tagpr

on:
  push:
    branches: ["master"]

permissions:
  contents: write
  pull-requests: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: Songmu/tagpr@e1250d6c84e4425db82b5e90549d62dfe23e9ebe # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
